# Basic dashboard JSON so beginners can see key service metrics immediately.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
data:
  kubeserve-overview.json: |
    {
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": "-- Grafana --",
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          }
        ]
      },
      "editable": true,
      "panels": [
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "ops" }, "overrides": [] },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "id": 1,
          "title": "Gateway Jobs/sec",
          "type": "timeseries",
          "targets": [
            {
              "expr": "rate(gateway_jobs_created_total[1m])",
              "legendFormat": "created",
              "refId": "A"
            }
          ]
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "ops" }, "overrides": [] },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "id": 2,
          "title": "Worker Jobs/sec",
          "type": "timeseries",
          "targets": [
            {
              "expr": "rate(worker_jobs_processed_total[1m])",
              "legendFormat": "processed",
              "refId": "A"
            },
            {
              "expr": "rate(worker_jobs_failed_total[1m])",
              "legendFormat": "failed",
              "refId": "B"
            }
          ]
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "s" }, "overrides": [] },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "id": 3,
          "title": "Gateway Submit p95",
          "type": "timeseries",
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum(rate(gateway_job_submit_latency_seconds_bucket[5m])) by (le))",
              "legendFormat": "p95",
              "refId": "A"
            }
          ]
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "s" }, "overrides": [] },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
          "id": 4,
          "title": "Worker Processing p95",
          "type": "timeseries",
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum(rate(worker_job_processing_seconds_bucket[5m])) by (le))",
              "legendFormat": "p95",
              "refId": "A"
            }
          ]
        }
      ],
      "refresh": "10s",
      "schemaVersion": 39,
      "style": "dark",
      "tags": ["kubeserve", "lab"],
      "templating": { "list": [] },
      "time": { "from": "now-15m", "to": "now" },
      "title": "Kubeserve Lab Overview",
      "uid": "kubeserve-overview",
      "version": 1
    }

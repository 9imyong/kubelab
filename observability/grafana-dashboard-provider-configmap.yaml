# Dashboard provider tells Grafana where JSON dashboards are mounted.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
data:
  dashboards.yml: |
    apiVersion: 1
    providers:
      - name: kubeserve
        orgId: 1
        folder: kubeserve-lab
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards
